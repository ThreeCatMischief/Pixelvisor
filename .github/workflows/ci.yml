name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio test -e native
      - run: pio run -e esp32-c3-supermini -e esp32dev
      - run: python3 tools/mock_device.py --self-test

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: apps/macos/build.sh test
      - run: apps/macos/build.sh app
