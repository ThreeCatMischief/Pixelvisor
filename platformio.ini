; Pixelvisor firmware. The PlatformIO project is the repo root; sources are in firmware/src.
; WiFi is set up at runtime through the setup portal; no credentials are compiled in.
;
;   pio run -t upload -t monitor              ESP32-C3 SuperMini over USB
;   pio run -e esp32dev -t upload -t monitor  classic ESP32 dev board over USB
;   pio run -e ota -t upload                  update over WiFi (POST /api/ota)
;   pio test -e native                        host tests

[platformio]
default_envs = esp32-c3-supermini
src_dir  = firmware
test_dir = firmware/test

[device]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
framework = arduino
board_build.partitions = min_spiffs.csv   ; two 1.9 MB OTA slots, no filesystem needed
build_src_filter = +<src/>
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    bblanchon/ArduinoJson@^7
    adafruit/Adafruit NeoPixel@^1.12
build_flags =
    -DCORE_DEBUG_LEVEL=3

[env:esp32-c3-supermini]
extends = device
board = esp32-c3-devkitm-1
build_flags =
    ${device.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLB_DEFAULT_DATA_PIN=4

; Classic ESP32 (ESP32-WROOM-32 dev boards). GPIO 16/17 do not exist on WROVER modules.
[env:esp32dev]
extends = device
board = esp32dev
build_flags =
    ${device.build_flags}
    -DLB_DEFAULT_DATA_PIN=16
    -DLB_DATA_PINS=4,13,14,16,17,18,19,21,22,23,25,26,27,32,33

; Update a running device over WiFi. Change upload_port if you renamed it.
[env:ota]
extends = env:esp32-c3-supermini
upload_protocol = custom
upload_port = pixelvisor.local
upload_command = curl --fail-with-body -sS -H "Content-Type: application/octet-stream" --data-binary @$SOURCE http://$UPLOAD_PORT/api/ota

; The hardware-independent sources, against protocol/fixtures.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<src/model.cpp> +<src/effects.cpp> +<src/render.cpp> +<src/realtime.cpp>
build_flags =
    -std=c++17
    -I firmware/src
    -DLB_FIXTURES_DIR=\"$PROJECT_DIR/protocol/fixtures\"
lib_deps = bblanchon/ArduinoJson@^7
